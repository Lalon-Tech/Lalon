<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress harmless Vite dev server WebSocket/HMR disconnect messages and iframe permission notices
      (function() {
        function shouldSuppress(arg) {
          if (!arg) return false;
          const text = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg) || '');
          return (
            text.includes('[vite]') ||
            text.includes("reading 'send'") ||
            text.includes('send was called before connect') ||
            text.includes('failed to connect to websocket') ||
            text.includes('WebSocket connection to') ||
            text.includes('server connection lost') ||
            text.includes('publickey-credentials-create') ||
            text.includes('publickey-credentials-get') ||
            text.includes('cssRules') ||
            text.includes('Error inlining remote css') ||
            text.includes('Error loading remote stylesheet') ||
            text.includes('Error while reading CSS rules')
          );
        }

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(shouldSuppress)) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(shouldSuppress)) {
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message) || shouldSuppress(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
