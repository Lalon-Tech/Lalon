<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .h-title {
        font-family: 'Hind Siliguri', 'Lohit Bengali', sans-serif;
        font-size: 30px;
        font-weight: 800;
        fill: #0f172a;
      }
      .h-motto {
        font-family: 'Hind Siliguri', 'Lohit Bengali', sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #15803d;
      }
      .h-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 12px;
        font-weight: 800;
        fill: #1e3a8a;
        letter-spacing: 2px;
      }
    </style>
    <linearGradient id="h-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="h-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="h-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Circular Emblem Seal (at cx=70, cy=70, r=60) -->
  <g transform="translate(70, 70)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.5" />
    
    <!-- Mini Handshake (scale 0.38) -->
    <g transform="scale(0.38)">
      <path d="M -85 -55 C -65 -90 -20 -105 25 -98 C 45 -95 65 -82 78 -65 C 82 -60 80 -52 74 -50 C 66 -48 60 -54 52 -60 C 35 -72 12 -76 -8 -70 C -38 -60 -60 -35 -66 -2 L -85 -55 Z" 
            fill="url(#h-green)" />
      <path d="M -66 -2 C -64 28 -45 58 -18 74 C -1 84 22 86 46 78 L 38 56 C 22 60 4 58 -10 50 C -30 38 -44 14 -46 -8 L -66 -2 Z" 
            fill="url(#h-green)" />
      <path d="M 85 55 C 65 90 20 105 -25 98 C -45 95 -65 82 -78 65 C -82 60 -80 52 -74 50 C -66 48 -60 54 -52 60 C -35 72 -12 76 8 70 C 38 60 60 35 66 2 L 85 55 Z" 
            fill="url(#h-navy)" />
      <path d="M 66 2 C 64 -28 45 -58 18 -74 C 1 -84 -22 -86 -46 -78 L -38 -56 C -22 -60 -4 -58 10 -50 C 30 -38 44 -14 46 8 L 66 2 Z" 
            fill="url(#h-navy)" />
      <rect x="-34" y="-22" width="68" height="16" rx="8" fill="url(#h-green)" transform="rotate(-32)" />
      <rect x="-30" y="4" width="60" height="16" rx="8" fill="url(#h-green)" transform="rotate(-32)" />
      <rect x="-26" y="30" width="52" height="16" rx="8" fill="url(#h-green)" transform="rotate(-32)" />
      <rect x="-20" y="-40" width="60" height="16" rx="8" fill="url(#h-navy)" transform="rotate(148)" />
      <rect x="-22" y="-14" width="64" height="16" rx="8" fill="url(#h-navy)" transform="rotate(148)" />
      <rect x="-24" y="12" width="56" height="16" rx="8" fill="url(#h-navy)" transform="rotate(148)" />
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="32" fill="url(#h-gold)" stroke="#ffffff" stroke-width="3.5" />
        <path d="M 0 -20 L 5 -5 L 20 0 L 5 5 L 0 20 L -5 5 L -20 0 L -5 -5 Z" fill="#ffffff" />
        <circle cx="0" cy="0" r="5" fill="url(#h-gold)" />
      </g>
    </g>
  </g>

  <!-- Right Typography -->
  <text x="150" y="54" class="h-title">বন্ধু সমবায় সমিতি লিমিটেড</text>
  
  <g transform="translate(150, 74)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" />
    <text x="90" y="16.5" class="h-motto" text-anchor="middle">ঐক্য • সঞ্চয় • সমৃদ্ধি • সেবা</text>
  </g>

  <text x="150" y="122" class="h-sub">GOVT. REG. NO: 1938/DHAKA/2018 • COOPERATIVE SOCIETY</text>
</svg>