<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    </style>

    <!-- Gradients -->
    <linearGradient id="em-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="em-green" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="em-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="256" cy="256" r="248" fill="#ffffff" stroke="url(#gold-border)" stroke-width="6" filter="url(#badge-shadow)" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="#10b981" stroke-width="3" opacity="0.7" />

  <!-- Center Artwork: Cooperative Unity Handshake & Growth Spark -->
  <g transform="translate(256, 195)">
    <!-- Inner Aura Circle -->
    <circle cx="0" cy="0" r="125" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

    <!-- 1. Left Arm / Hand (Emerald Green): Sweeps around left to bottom-center -->
    <path d="M -85 -55 C -65 -90 -20 -105 25 -98 C 45 -95 65 -82 78 -65 C 82 -60 80 -52 74 -50 C 66 -48 60 -54 52 -60 C 35 -72 12 -76 -8 -70 C -38 -60 -60 -35 -66 -2 L -85 -55 Z" 
          fill="url(#em-green)" />
    <path d="M -66 -2 C -64 28 -45 58 -18 74 C -1 84 22 86 46 78 L 38 56 C 22 60 4 58 -10 50 C -30 38 -44 14 -46 -8 L -66 -2 Z" 
          fill="url(#em-green)" />

    <!-- 2. Right Arm / Hand (Royal Sapphire Navy): Sweeps around right to top-center -->
    <path d="M 85 55 C 65 90 20 105 -25 98 C -45 95 -65 82 -78 65 C -82 60 -80 52 -74 50 C -66 48 -60 54 -52 60 C -35 72 -12 76 8 70 C 38 60 60 35 66 2 L 85 55 Z" 
          fill="url(#em-navy)" />
    <path d="M 66 2 C 64 -28 45 -58 18 -74 C 1 -84 -22 -86 -46 -78 L -38 -56 C -22 -60 -4 -58 10 -50 C 30 -38 44 -14 46 8 L 66 2 Z" 
          fill="url(#em-navy)" />

    <!-- 3. Clasping Interlocking Fingers in Center -->
    <rect x="-34" y="-22" width="68" height="16" rx="8" fill="url(#em-green)" transform="rotate(-32)" />
    <rect x="-30" y="4" width="60" height="16" rx="8" fill="url(#em-green)" transform="rotate(-32)" />
    <rect x="-26" y="30" width="52" height="16" rx="8" fill="url(#em-green)" transform="rotate(-32)" />

    <rect x="-20" y="-40" width="60" height="16" rx="8" fill="url(#em-navy)" transform="rotate(148)" />
    <rect x="-22" y="-14" width="64" height="16" rx="8" fill="url(#em-navy)" transform="rotate(148)" />
    <rect x="-24" y="12" width="56" height="16" rx="8" fill="url(#em-navy)" transform="rotate(148)" />

    <!-- 4. Golden Star of Wealth & Growth at Center Clasp -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="32" fill="url(#em-gold)" stroke="#ffffff" stroke-width="3.5" />
      <path d="M 0 -20 L 5 -5 L 20 0 L 5 5 L 0 20 L -5 5 L -20 0 L -5 -5 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="5" fill="url(#em-gold)" />
    </g>

    <!-- 5. Laurel Leaves of Prosperity (Left & Right) -->
    <g fill="url(#em-green)">
      <ellipse cx="-110" cy="-20" rx="11" ry="6" transform="rotate(-35 -110 -20)" />
      <ellipse cx="-115" cy="10" rx="11" ry="6" transform="rotate(5 -115 10)" />
      <ellipse cx="-106" cy="40" rx="11" ry="6" transform="rotate(40 -106 40)" />
    </g>
    <g fill="url(#em-navy)">
      <ellipse cx="110" cy="-20" rx="11" ry="6" transform="rotate(35 110 -20)" />
      <ellipse cx="115" cy="10" rx="11" ry="6" transform="rotate(-5 115 10)" />
      <ellipse cx="106" cy="40" rx="11" ry="6" transform="rotate(-40 106 40)" />
    </g>
  </g>

  <!-- High-Contrast Bold Name Plaque at Bottom -->
  <g transform="translate(256, 396)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="url(#em-navy)" stroke="url(#gold-border)" stroke-width="2.5" />
    <text x="0" y="10" font-family="'Hind Siliguri', 'Lohit Bengali', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">বন্ধু সমবায় সমিতি</text>
  </g>

  <!-- Tagline below plaque -->
  <text x="256" y="456" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="3.5px" fill="#047857" text-anchor="middle">COOPERATIVE SOCIETY LTD.</text>
</svg>